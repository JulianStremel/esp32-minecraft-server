; ESP32 Minecraft server (Minecraft Java Edition 1.16.5, protocol 754)
;
;   pio run -e esp32-wrover -t upload      ESP32 with PSRAM (recommended)
;   pio run -e esp32dev -t upload          plain ESP32 (4 players, small view distance)
;   pio run -e esp32-s3 -t upload          ESP32-S3 with 8 MB octal PSRAM
;
; Copy include/config_edit_me.h to include/config.h first.

[platformio]
default_envs = esp32-wrover

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wno-missing-field-initializers

; ESP32 without PSRAM (e.g. ESP32-DevKitC with WROOM-32): tight memory limits.
; About 9 chunks of normal terrain fit in RAM; superflat worlds are much lighter.
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DMC_MAX_PLAYERS=3
    -DMC_MAX_VIEW_DISTANCE=4
    -DMC_MAX_ENTITIES=32
    -DMC_LIGHT_QUEUE=1024
    -DMC_SCHED_TICKS=192
    -DMC_IN_BUF=3072
    -DMC_OUT_BUF=4096
    -DMC_PACKET_SCRATCH=4096
    -DMC_INFLATE_MAX=4096

; ESP32 with 4-8 MB PSRAM (ESP32-WROVER, TTGO T8, ...): recommended
[env:esp32-wrover]
board = esp-wrover-kit
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DMC_MAX_PLAYERS=8
    -DMC_MAX_VIEW_DISTANCE=8
    -DMC_MAX_ENTITIES=96
    -DMC_PACKET_SCRATCH=6144

; ESP32-S3 N8R8 / N16R8 (octal PSRAM)
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DMC_MAX_PLAYERS=10
    -DMC_MAX_VIEW_DISTANCE=8
    -DMC_MAX_ENTITIES=128
    -DMC_PACKET_SCRATCH=6144
