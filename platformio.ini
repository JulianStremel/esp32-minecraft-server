; ESP32 Minecraft server (Minecraft Java Edition 1.16.5, protocol 754)
;
; Supported hardware: boards with at least 8 MB of PSRAM.
;
;   pio run -e esp32-s3 -t upload          ESP32-S3 N8R8 / N16R8 (octal PSRAM) - recommended
;   pio run -e esp32-wrover -t upload      ESP32 WROVER-E with 8 MB PSRAM (4 MB of it is mappable)
;   tools/qemu/run.sh                      the firmware in QEMU (virtual ESP32-S3, 8 MB PSRAM)
;
; Copy include/config_edit_me.h to include/config.h first (not needed for QEMU).

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wno-missing-field-initializers
    -DBOARD_HAS_PSRAM

; ESP32-S3 N8R8 / N16R8 (octal PSRAM)
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DMC_MIN_PSRAM_MB=8
    -DMC_MAX_PLAYERS=10
    -DMC_MAX_VIEW_DISTANCE=8
    -DMC_MAX_ENTITIES=128
    -DMC_PACKET_SCRATCH=6144

; ESP32 WROVER-E with 8 MB PSRAM. The classic ESP32 maps only 4 MB of PSRAM.
[env:esp32-wrover]
board = esp-wrover-kit
build_flags =
    ${env.build_flags}
    -mfix-esp32-psram-cache-issue
    -DMC_MIN_PSRAM_MB=4
    -DMC_MAX_PLAYERS=8
    -DMC_MAX_VIEW_DISTANCE=8
    -DMC_MAX_ENTITIES=96
    -DMC_PACKET_SCRATCH=6144

; ESP32-S3 with 8 MB of (quad SPI) PSRAM inside Espressif's QEMU. There is no WiFi in
; the emulator: the firmware uses the emulated OpenCores Ethernet and QEMU user networking.
; Build, boot, debug and load-test with tools/qemu/run.sh and test/qemu_load.js.
[env:esp32s3-qemu]
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
build_flags =
    ${env.build_flags}
    -g
    -DMC_QEMU
    -DMC_MIN_PSRAM_MB=8
    -DMC_MAX_PLAYERS=10
    -DMC_MAX_VIEW_DISTANCE=8
    -DMC_MAX_ENTITIES=128
    -DMC_PACKET_SCRATCH=6144
