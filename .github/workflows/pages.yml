# Builds the esp32s3-8 firmware and publishes the web flasher (web/) with the
# binaries to GitHub Pages. Repository settings -> Pages -> Source: "GitHub Actions".
name: Web flasher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Write a credential-free include/config.h
        # Public firmware must not carry anyone's WiFi credentials or LAN addresses.
        # The SSID is a non-empty placeholder: the board just keeps retrying it.
        shell: bash
        run: |
          cat > include/config.h <<'EOF'
          // Generated by .github/workflows/pages.yml for the web flasher.
          #include "config_edit_me.h"
          #undef WIFI_SSID
          #undef WIFI_PASSWORD
          #undef NBD_HOST
          #undef MC_OPS
          #define WIFI_SSID     "unconfigured"
          #define WIFI_PASSWORD ""
          #define NBD_HOST      ""
          #define MC_OPS        ""
          EOF
      - name: Build esp32s3-8
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          tools/idf/build.sh --board esp32s3-8 build merge-bin
      - name: Assemble the site
        shell: bash
        run: |
          B=build/esp32s3-8
          mkdir -p _site/firmware
          cp web/index.html _site/
          cp "$B/bootloader/bootloader.bin" "$B/partition_table/partition-table.bin" \
             "$B/mcserver.bin" _site/firmware/
          cp "$B/merged-binary.bin" _site/firmware/mcserver-esp32s3-merged.bin
          # Fail if the manifest's offsets drift from the build's flash_args; stamp the version.
          python3 - "$B/flash_args" web/manifest.json _site/manifest.json "${GITHUB_SHA::7}" <<'EOF'
          import json, os, sys
          args, src, dst, version = sys.argv[1:]
          built = {}
          for line in open(args):
              parts = line.split()
              if len(parts) == 2 and parts[0].startswith("0x"):
                  built[os.path.basename(parts[1])] = int(parts[0], 16)
          manifest = json.load(open(src))
          listed = {os.path.basename(p["path"]): p["offset"]
                    for b in manifest["builds"] for p in b["parts"]}
          if listed != built:
              sys.exit(f"manifest {listed} does not match flash_args {built}")
          manifest["version"] = version
          json.dump(manifest, open(dst, "w"), indent=2)
          print("manifest OK:", built)
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
