# The web flasher on GitHub Pages: web/index.html with the firmware of the newest GitHub
# releases (copied here: release downloads carry no CORS headers, so the page cannot
# fetch them from GitHub) and a development build of main.
# Runs on pushes to main, after a release (release.yml dispatches it) and by hand.
# Repository settings -> Pages -> Source: "GitHub Actions".
name: Web flasher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  dev:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build the development firmware (esp32s3-8)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          VERSION="main-$(git rev-parse --short=7 HEAD)"
          MC_VERSION="$VERSION" tools/idf/build.sh --board esp32s3-8 --release build merge-bin
          python3 tools/release/package.py build/esp32s3-8-release esp32s3-8 "$VERSION" dev
      - uses: actions/upload-artifact@v4
        with:
          name: flasher-dev
          path: dev/
  build:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: flasher-dev
          path: dev
      - name: Download the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p releases
          gh release list --limit 5 --exclude-drafts --json tagName,isPrerelease \
            --jq '.[] | "\(.tagName) \(.isPrerelease)"' > releases/order.txt
          cat releases/order.txt
          while read -r tag pre; do
            gh release download "$tag" --dir "releases/$tag" --pattern 'mcserver-esp32s3-8-*' \
              --pattern 'manifest-esp32s3-8.json' || echo "$tag: no flasher files"
          done < releases/order.txt
      - name: Assemble the site
        run: python3 tools/release/site.py _site releases dev
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
